# ============================================================
#  Experience / 经历
#  工作、学历、访学合并在一个版块，按时间倒序（最新在最上）。
#  参考 Hankai Liu 的做法：合并后时间线一目了然，
#  访学与读博时间重叠也不会显得对不上。
# ------------------------------------------------------------
#  字段说明：
#    period   时间区间，用于显示
#    sort     排序用的起始年月数字（YYYYMM），越大越靠上
#    kind     类型：position（职位）/ degree（学位）/ visiting（访学）
#    role     职位或学位名称
#    org      机构
#    dept     院系（可留空）
#    location 所在地（可留空）
#    advisor  导师（可留空）
#    logo     学校图标：填 assets/img/logo/ 下的文件名；
#             留空则自动用 abbr 的文字圆形占位
#    abbr     机构缩写，用于文字占位图标
# ============================================================

