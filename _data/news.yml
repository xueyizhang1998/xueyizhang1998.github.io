  zh: 于<b>国防科技大学</b>获得博士学位。
- date: '2025.09'
  en: Our paper on multi-band sEEG auditory reconstruction was accepted to <b>NeurIPS 2025</b> (Datasets and Benchmarks
    Track).
  zh: 多频段 sEEG 听觉重建论文被 <b>NeurIPS 2025</b> 数据集与基准赛道接收。
