  en: Joined the <b>National University of Singapore</b> as a Research Fellow.
  zh: 加入<b>新加坡国立大学</b>，任博士后研究员（Research Fellow）。
- date: '2026.01'
  en: Our work on exemplar-free continual video action recognition was accepted to <b>AAAI 2026 (Oral)</b>.
  zh: 无样本回放持续视频动作识别工作被 <b>AAAI 2026</b> 接收，并获 <b>Oral</b> 展示。
- date: '2025.09'
  en: Our paper on multi-band sEEG auditory reconstruction is accepted to <b>NeurIPS 2025</b> (Datasets &amp; Benchmarks
    Track).
  zh: 多频段 sEEG 听觉重建工作被 <b>NeurIPS 2025</b>（Datasets &amp; Benchmarks Track）接收。
