  zh: 加入<b>新加坡国立大学</b>，任博士后研究员（Research Fellow）。
- date: '2026.01'
  en: Our paper on exemplar-free continual video action recognition was selected for an <b>oral presentation at
    AAAI 2026</b>.
  zh: 无样本回放持续视频动作识别论文入选 <b>AAAI 2026 口头报告</b>。
