- date: 2026.08.24
  en: '<b>HELIX Corporate Lab launch at NUS.</b> Presented our research to NUS President Prof. Tan Eng Chye, Singapore’s
    Senior Minister of State for Trade and Industry Ms Low Yen Ling, and STMicroelectronics Executive Vice President
    Bertrand Stoltz. Our <b>real-time translation glasses</b> run large AI models on device for any-to-any translation
    across <b>14 languages</b>, with latency of at most <b>200 ms</b> and no internet connection required. Demo
    co-leads: Prof. Haizhou Li, Prof. Massimo Alioto, and Dr. Xueyi Zhang.'
  zh: <b>HELIX 联合实验室在新加坡国立大学正式启动。</b>代表团队向新加坡国立大学校长陈永财教授、新加坡贸工部高级政务部长刘燕玲及意法半导体执行副总裁 Bertrand Stoltz 展示研究成果。演示的<b>实时
    AI 翻译眼镜</b>在设备端运行大模型，支持 <b>14 种语言</b>任意互译与自然切换，延迟不超过 <b>200 毫秒</b>，无需联网。演示联合负责人：李海洲教授、Massimo Alioto 教授与 Xueyi
    Zhang 博士。
