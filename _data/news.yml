- date: 2026.08.24
  en: <b>HELIX Corporate Lab launch at NUS.</b> At the launch, I presented our <b>on-device translation glasses</b>
    with Haizhou Li and Massimo Alioto. The system supports translation across <b>14 languages</b> with latency
    of at most <b>200 ms</b> and works without an internet connection. The demonstration was featured on NUS’s LinkedIn
    and Instagram.
  zh: <b>HELIX 联合实验室在新加坡国立大学启动。</b>与李海洲教授、Massimo Alioto 教授共同展示<b>端侧实时翻译眼镜</b>。系统支持 <b>14 种语言</b>互译，延迟不超过 <b>200
    毫秒</b>，可离线运行。新加坡国立大学官方 LinkedIn 和 Instagram 发布了此次展示。
