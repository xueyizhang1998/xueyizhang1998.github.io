- period: 2024.12 – 2026.06
  name:
    en: Full-Duplex Affective Dialogue Robot
    zh: 全双工情感对话机器人
  program:
    en: The Chinese University of Hong Kong, Shenzhen
    zh: 香港中文大学（深圳）
  role:
    en: With Haizhou Li
    zh: 与李海洲教授合作
  description:
    en: Developed a full-duplex dialogue robot that listens while speaking and supports natural interruptions. It
      combines fast and slow response mechanisms and uses speech, facial expressions, gaze, and posture to infer
      emotion, guiding empathetic speech and coordinated nonverbal behavior.
    zh: 研发支持边说边听与自然打断的全双工对话机器人。系统结合快慢响应机制，从语音、表情、视线和姿态中识别情绪，协调共情语音、表情及头部与视线反馈。
  note:
    en: Related manuscript under review.
    zh: 相关论文正在审稿。
