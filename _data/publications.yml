# ============================================================
#  Publications / 论文（均为第一作者，来源 DBLP pid 90/10666-1）
# ------------------------------------------------------------
#  字段说明（新增论文时复制一个 "- title:" 块）：
#    title      论文标题
#    authors    作者列表；用 **名字** 包住会自动加粗
#    venue      会议/期刊 + 年份
#    year       年份（只用于显示，不参与排序）
#    order      ★必填★ 显示顺序，数字越大越靠前。现有值按 10 递增（10~100），
#               插一篇到中间就用中间值（如 75）。漏填当成 0，会掉到最底下。
#               为什么不用 year 排序：同年论文会并列，Jekyll 的排序对并列项
#               顺序不保证稳定，线上和本地预览可能不一致，所以用唯一的 order。
#    group      所属研究方向，对应 pub_groups.yml 里的 id
#    selected   true = 代表作（显示 ★，并出现在“代表性论文”区）
#    image      主图/teaser 路径，如 /assets/img/pub/xxx.jpg；留空显示占位
#    tags       小标签数组
#    desc       一句话贡献要点（中英各一版，可留空）
#    links:     只填有的；paper/code/project/doi/bibtex/video
#               paper 建议优先填免费全文（arXiv / CVF / ACL Anthology / 官方 PDF），
#               doi 单独填正式 DOI；两者都有时会显示两个按钮，DOI 那个是灰色次要样式。
#               若 paper 本身就是 doi.org 链接，就不用再填 doi，免得重复。
#    note       备注，如 Oral / Spotlight / Datasets & Benchmarks Track
#
#  注意：仅 NeuroListen 与 CSLR 两篇有已验证的官方代码仓库，
#        其余论文暂未找到公开官方仓库，故不设 code 链接（勿臆造）。
# ============================================================

