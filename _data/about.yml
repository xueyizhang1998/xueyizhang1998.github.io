bio:
  en: I am a <b>Research Fellow</b> at the <a href="https://www.comp.nus.edu.sg/" target="_blank" rel="noopener">School
    of Computing, National University of Singapore (NUS)</a>. I work with <a href="https://zjhzjh123.github.io/"
    target="_blank" rel="noopener">Jiaheng Zhang</a> (Presidential Young Professor and NRF Fellow) and <a href="https://www.comp.nus.edu.sg/~hebs/"
    target="_blank" rel="noopener">Bingsheng He</a> (IEEE Fellow), and collaborate with <a href="https://cde.nus.edu.sg/ece/staff/li-haizhou/"
    target="_blank" rel="noopener">Haizhou Li</a> (IEEE Fellow) and <a href="https://in.linkedin.com/in/nitin-chawla-7081659"
    target="_blank" rel="noopener">Nitin Chawla</a> (ST Fellow, STMicroelectronics).<br><br>My research focuses
    on <b>large multimodal models</b>, particularly <b>efficient inference, on-chip deployment, and algorithm–hardware
    co-design</b>.<br><br>I received my Ph.D. in Control Science and Engineering from the <b>National University
    of Defense Technology</b> in December 2025 and my B.Eng. in Electronic Information Engineering from <b>Dalian
    Maritime University</b> in 2020. Before joining NUS, I was a Research Assistant at <b>The Chinese University
    of Hong Kong, Shenzhen</b>.<br><br>As an undergraduate at Dalian Maritime University, I received the <b>President’s
    Scholarship</b> and <b>Top Ten Students Award</b> (the university’s highest undergraduate honors; the latter recognizes
    10 undergraduates university-wide each year). During my Ph.D. at NUDT, I received the <b>Deya Scholar</b> award
    (the university’s highest student honor; 15 recipients university-wide each year across undergraduate, master’s,
    and doctoral programs).
  zh: 我现任<b>新加坡国立大学计算机学院</b>博士后研究员（Research Fellow），与<a href="https://zjhzjh123.github.io/" target="_blank" rel="noopener">张嘉恒</a>（Presidential
    Young Professor、NRF Fellow）和 <a href="https://www.comp.nus.edu.sg/~hebs/" target="_blank" rel="noopener">Bingsheng
    He</a>（IEEE Fellow）合作，并与<a href="https://cde.nus.edu.sg/ece/staff/li-haizhou/" target="_blank" rel="noopener">李海洲教授</a>（IEEE
    Fellow）及意法半导体的 <a href="https://in.linkedin.com/in/nitin-chawla-7081659" target="_blank" rel="noopener">Nitin
    Chawla</a>（ST Fellow）开展合作。<br><br>我的研究聚焦<b>多模态大模型</b>，重点关注<b>高效推理、片上部署，以及算法与硬件协同设计（co-design）</b>。<br><br>2025
    年 12 月，我于<b>国防科技大学</b>获得控制科学与工程博士学位；2020 年于<b>大连海事大学</b>获得电子信息工程学士学位。加入新加坡国立大学前，我曾在<b>香港中文大学（深圳）</b>担任研究助理。<br><br>本科期间，我获得大连海事大学<b>校长奖学金</b>和<b>十佳大学生</b>（学校最高本科生荣誉；十佳大学生每年从全校本科生中评选
    10 人）。博士期间，我获评国防科技大学<b>德雅学子 Deya Scholar</b>（学校最高学生荣誉；每年从全校本科生、硕士生和博士生中共评选 15 人）。
