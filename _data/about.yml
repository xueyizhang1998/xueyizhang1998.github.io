bio:
  en: I am a <b>Research Fellow</b> in the <a href="https://www.comp.nus.edu.sg/" target="_blank" rel="noopener">School
    of Computing at the National University of Singapore (NUS)</a>, working with <a href="https://zjhzjh123.github.io/"
    target="_blank" rel="noopener">Jiaheng Zhang</a> and <a href="https://www.comp.nus.edu.sg/~hebs/" target="_blank"
    rel="noopener">Bingsheng He</a>. I also collaborate with <a href="https://cde.nus.edu.sg/ece/staff/li-haizhou/"
    target="_blank" rel="noopener">Haizhou Li</a> and <a href="https://in.linkedin.com/in/nitin-chawla-7081659"
    target="_blank" rel="noopener">Nitin Chawla</a> (STMicroelectronics).<br><br>My research focuses on <b>AI safety,
    continual learning, and multimodal perception</b>. I develop methods for learning from evolving data and noisy
    supervision, with applications in deepfake detection, lip reading, neural signal decoding, and wearable AI.<br><br>Before
    joining NUS, I was a Research Assistant at <b>The Chinese University of Hong Kong, Shenzhen</b>. I received
    my Ph.D. in Control Science and Engineering from the <b>National University of Defense Technology</b> in 2025
    and my B.Eng. in Electronic Information Engineering from <b>Dalian Maritime University</b> in 2020.
  zh: 我现任<b>新加坡国立大学计算机学院</b>博士后研究员（Research Fellow），与 <a href="https://zjhzjh123.github.io/" target="_blank" rel="noopener">Jiaheng
    Zhang</a> 和 <a href="https://www.comp.nus.edu.sg/~hebs/" target="_blank" rel="noopener">Bingsheng He</a> 合作，并与<a
    href="https://cde.nus.edu.sg/ece/staff/li-haizhou/" target="_blank" rel="noopener">李海洲教授</a>及意法半导体的 <a href="https://in.linkedin.com/in/nitin-chawla-7081659"
    target="_blank" rel="noopener">Nitin Chawla</a> 开展合作。<br><br>我的研究聚焦<b>人工智能安全、持续学习与多模态感知</b>，关注数据与任务变化、噪声监督条件下的可靠学习，应用涵盖深度伪造检测、唇语识别、神经信号解码和可穿戴
    AI。<br><br>此前，我在<b>香港中文大学（深圳）</b>担任研究助理。2025 年于<b>国防科技大学</b>获得控制科学与工程博士学位，2020 年于<b>大连海事大学</b>获得电子信息工程学士学位。
